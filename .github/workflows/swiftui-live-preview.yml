name: Live SwiftUI Preview

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Public GitHub repo in owner/name form"
        required: true
        default: "signerlabs/ShipSwift"
        type: string
      source_ref:
        description: "Branch, tag, or commit"
        required: true
        default: "main"
        type: string
      swift_file:
        description: "Path to a Swift file containing #Preview or PreviewProvider"
        required: true
        default: "ShipSwift/SWPackage/SWComponent/Display/SWGradientDivider.swift"
        type: string
      context:
        description: "standalone = original file only; project = resolve its original Xcode/SPM project"
        required: true
        default: "standalone"
        type: choice
        options:
          - standalone
          - project
      duration_minutes:
        description: "Keep the live preview available for 5-45 minutes"
        required: false
        default: "20"
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/swiftui-live-preview.yml"

permissions:
  contents: read

jobs:
  preview:
    name: SwiftUI preview in browser
    runs-on: macos-26
    timeout-minutes: 55
    env:
      SOURCE_REPO: ${{ github.event_name == 'workflow_dispatch' && inputs.source_repo || 'signerlabs/ShipSwift' }}
      SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || 'main' }}
      SWIFT_FILE: ${{ github.event_name == 'workflow_dispatch' && inputs.swift_file || 'ShipSwift/SWPackage/SWComponent/Display/SWGradientDivider.swift' }}
      PREVIEW_CONTEXT: ${{ github.event_name == 'workflow_dispatch' && inputs.context || 'standalone' }}
      DURATION_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.duration_minutes || '8' }}

    steps:
      - name: Select Xcode and iOS runtime
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(python3 - <<'PY'
          from pathlib import Path
          import re
          xs=[]
          for p in Path('/Applications').glob('Xcode*.app'):
              m=re.search(r'Xcode[_-]?(\d+(?:\.\d+)*)', p.name)
              if m:
                  v=tuple(int(x) for x in m.group(1).split('.'))
                  if v and v[0] >= 26: xs.append((v,str(p)))
          if xs: print(max(xs)[1])
          elif Path('/Applications/Xcode.app').exists(): print('/Applications/Xcode.app')
          PY
          )"
          test -n "$XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          echo "Architecture: $(uname -m)"
          if ! xcrun simctl list runtimes | grep -q "iOS 26"; then
            xcodebuild -downloadPlatform iOS
          fi

      - name: Install preview and browser-stream tools
        shell: bash
        run: |
          set -euo pipefail
          brew tap obj-p/tap
          brew trust obj-p/tap
          brew install previewsmcp cloudflared caddy
          previewsmcp help >/dev/null
          npx -y serve-sim@latest --help >/dev/null

      - name: Clone original repository and select file
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none "https://github.com/${SOURCE_REPO}.git" source
          git -C source fetch --depth=1 origin "$SOURCE_REF"
          git -C source checkout --detach FETCH_HEAD
          ORIGINAL="$GITHUB_WORKSPACE/source/$SWIFT_FILE"
          test -f "$ORIGINAL" || { echo "File not found: $SWIFT_FILE"; exit 1; }
          grep -Eq '#Preview|PreviewProvider' "$ORIGINAL" || { echo "No SwiftUI preview declaration in $SWIFT_FILE"; exit 1; }

          ORIGINAL_SHA="$(shasum -a 256 "$ORIGINAL" | awk '{print $1}')"
          echo "Original file SHA256: $ORIGINAL_SHA"

          if [[ "$PREVIEW_CONTEXT" == "standalone" ]]; then
            PREVIEW_DIR="$RUNNER_TEMP/OriginalSwiftFile"
            rm -rf "$PREVIEW_DIR"
            mkdir -p "$PREVIEW_DIR"
            cp -p "$ORIGINAL" "$PREVIEW_DIR/$(basename "$ORIGINAL")"
            PREVIEW_TARGET="$PREVIEW_DIR/$(basename "$ORIGINAL")"
            cmp -s "$ORIGINAL" "$PREVIEW_TARGET"
            COPY_SHA="$(shasum -a 256 "$PREVIEW_TARGET" | awk '{print $1}')"
            [[ "$COPY_SHA" == "$ORIGINAL_SHA" ]]
            echo "Preview mode: standalone, byte-for-byte original Swift file, no Package.swift and no generated app project."
          else
            PREVIEW_DIR="$GITHUB_WORKSPACE/source"
            PREVIEW_TARGET="$ORIGINAL"
            if [[ "$SOURCE_REPO" == "signerlabs/ShipSwift" && ! -f "$GITHUB_WORKSPACE/source/ShipSwift/SWSecrets.swift" && -f "$GITHUB_WORKSPACE/source/SWSecrets.swift.example" ]]; then
              cp "$GITHUB_WORKSPACE/source/SWSecrets.swift.example" "$GITHUB_WORKSPACE/source/ShipSwift/SWSecrets.swift"
            fi
            echo "Preview mode: original repository project context."
          fi

          echo "PREVIEW_DIR=$PREVIEW_DIR" >> "$GITHUB_ENV"
          echo "PREVIEW_TARGET=$PREVIEW_TARGET" >> "$GITHUB_ENV"

      - name: Start original SwiftUI preview on real iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          cd "$PREVIEW_DIR"
          previewsmcp kill-daemon >/dev/null 2>&1 || true
          previewsmcp list "$PREVIEW_TARGET"

          rm -f /tmp/preview-run.log
          set +e
          previewsmcp run "$PREVIEW_TARGET" --platform ios --detach --json >/tmp/preview-run.log 2>&1 &
          PID=$!
          set -e

          FINISHED=false
          RC=0
          LIMIT=180
          if [[ "$PREVIEW_CONTEXT" == "project" ]]; then LIMIT=600; fi
          for _ in $(seq 1 "$LIMIT"); do
            if ! kill -0 "$PID" 2>/dev/null; then
              set +e
              wait "$PID"
              RC=$?
              set -e
              FINISHED=true
              break
            fi
            sleep 1
          done

          if [[ "$FINISHED" != "true" ]]; then
            echo "PreviewsMCP startup timeout after ${LIMIT}s."
            previewsmcp status --json || true
            previewsmcp logs -n 250 || true
            ps -ef | grep -E 'previewsmcp|xcodebuild|swiftc' | grep -v grep || true
            kill "$PID" 2>/dev/null || true
            exit 124
          fi

          cat /tmp/preview-run.log
          if [[ "$RC" -ne 0 ]]; then
            previewsmcp logs -n 250 || true
            exit "$RC"
          fi
          previewsmcp status --json || true
          previewsmcp simulators --json | tee /tmp/simulators.json

      - name: Stream simulator to localhost
        shell: bash
        run: |
          set -euo pipefail
          nohup npx -y serve-sim@latest --codec mjpeg --fit --panes devices,tools -p 3200 >/tmp/serve-sim.log 2>&1 &
          echo $! >/tmp/serve-sim.pid
          READY=false
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3200/.sim >/dev/null 2>&1 || curl -fsS http://127.0.0.1:3200 >/dev/null 2>&1; then
              READY=true
              break
            fi
            sleep 1
          done
          [[ "$READY" == "true" ]] || { cat /tmp/serve-sim.log; exit 1; }

      - name: Add temporary authentication
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          USERNAME="viewer"
          PASSWORD="$(python3 - <<'PY'
          import secrets
          print(secrets.token_urlsafe(12))
          PY
          )"
          HASH="$(caddy hash-password --plaintext "$PASSWORD")"
          cat >/tmp/Caddyfile <<EOF
          :3300 {
            basic_auth {
              $USERNAME $HASH
            }
            reverse_proxy 127.0.0.1:3200
          }
          EOF
          nohup caddy run --config /tmp/Caddyfile --adapter caddyfile >/tmp/caddy.log 2>&1 &
          echo $! >/tmp/caddy.pid
          for _ in $(seq 1 30); do
            if curl -fsS -u "$USERNAME:$PASSWORD" http://127.0.0.1:3300/.sim >/dev/null 2>&1; then break; fi
            sleep 1
          done
          echo "username=$USERNAME" >> "$GITHUB_OUTPUT"
          echo "password=$PASSWORD" >> "$GITHUB_OUTPUT"

      - name: Create temporary browser link
        id: tunnel
        shell: bash
        run: |
          set -euo pipefail
          nohup cloudflared tunnel --url http://127.0.0.1:3300 --no-autoupdate >/tmp/cloudflared.log 2>&1 &
          echo $! >/tmp/cloudflared.pid
          URL=""
          for _ in $(seq 1 60); do
            URL="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1 || true)"
            [[ -n "$URL" ]] && break
            sleep 1
          done
          [[ -n "$URL" ]] || { cat /tmp/cloudflared.log; exit 1; }
          USERNAME='${{ steps.auth.outputs.username }}'
          PASSWORD='${{ steps.auth.outputs.password }}'
          LIVE="$URL/.sim"
          echo "url=$LIVE" >> "$GITHUB_OUTPUT"
          echo "::notice title=LIVE SWIFTUI PREVIEW::$LIVE | Username: $USERNAME | Password: $PASSWORD"
          {
            echo "## Live SwiftUI Preview"
            echo
            echo "**Original source:** \`$SOURCE_REPO@$SOURCE_REF\`"
            echo
            echo "**File:** \`$SWIFT_FILE\`"
            echo
            echo "**Live URL:** $LIVE"
            echo
            echo "**Username:** \`$USERNAME\`"
            echo
            echo "**Password:** \`$PASSWORD\`"
            echo
            echo "> Real Apple iOS Simulator. Link and credentials expire when this workflow stops."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify public preview
        shell: bash
        run: |
          set -euo pipefail
          URL='${{ steps.tunnel.outputs.url }}'
          USERNAME='${{ steps.auth.outputs.username }}'
          PASSWORD='${{ steps.auth.outputs.password }}'
          for _ in $(seq 1 25); do
            if curl -fsS -u "$USERNAME:$PASSWORD" "$URL" >/dev/null 2>&1; then
              echo "Live preview is reachable from the Internet."
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Keep preview live
        shell: bash
        run: |
          set -euo pipefail
          MINUTES="$DURATION_MINUTES"
          [[ "$MINUTES" =~ ^[0-9]+$ ]] || MINUTES=20
          (( MINUTES < 5 )) && MINUTES=5
          (( MINUTES > 45 )) && MINUTES=45
          echo "Keeping live preview open for $MINUTES minutes. Cancel the workflow when finished."
          sleep "$((MINUTES * 60))"

      - name: Diagnostics on failure
        if: failure()
        shell: bash
        run: |
          echo "===== PreviewsMCP ====="
          previewsmcp logs -n 300 || true
          echo "===== Preview command ====="
          cat /tmp/preview-run.log 2>/dev/null || true
          echo "===== serve-sim ====="
          cat /tmp/serve-sim.log 2>/dev/null || true
          echo "===== Caddy ====="
          cat /tmp/caddy.log 2>/dev/null || true
          echo "===== cloudflared ====="
          cat /tmp/cloudflared.log 2>/dev/null || true
